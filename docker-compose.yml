# Solo base de datos para desarrollo. Backend y frontend se ejecutan localmente (ver docs/setup.md).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: notebooklm
      POSTGRES_PASSWORD: notebooklm
      POSTGRES_DB: notebooklm
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notebooklm"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
